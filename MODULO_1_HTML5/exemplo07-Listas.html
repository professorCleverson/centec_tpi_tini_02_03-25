<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Listas</title>
  </head>
  <body>
    <h1>Lista não ordenada - Marcadores</h1>
    <ul>
      <li>HTML</li>
      <li>CSS</li>
      <li>JavaScript</li>
    </ul>
    <h1>Lista ordenada - Numeração</h1>
    <ol>
      <li>Planejamento</li>
      <li>Desenvolvimento</li>
      <li>Testes</li>
    </ol>
    <h1>Lista de descrição</h1>
    <dl>
      <dt>HTML</dt>
      <dd>Linguagem de marcação.</dd>
      <dt>CSS</dt>
      <dd>Folhas de estilo.</dd>
    </dl>
  </body>
</html>
