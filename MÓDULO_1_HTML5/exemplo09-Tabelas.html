<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tabelas</title>
  </head>
  <body>
    <table border="1">
      <thead>
        <tr>
          <th>Nome</th>
          <th>CPF</th>

          <th>Idade</th>
        </tr>
      </thead>

      <tbody>
        <tr>
          <td>Maria</td>
          <td>999.999.999-99</td>

          <td>22</td>
        </tr>
      </tbody>

      <tfoot>
        <tr>
          <td colspan="3">Fim da tabela</td>
        </tr>
      </tfoot>
    </table>
  </body>
</html>
